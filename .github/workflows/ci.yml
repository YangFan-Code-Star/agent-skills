name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 语法检查
        run: |
          node --check .agents/skills/init/scaffold.mjs
          node --check .agents/skills/init/templates/scripts/audit-context.mjs
      - name: 冒烟测试
        run: node --test
